name: Testes Django

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  testes:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "chave-falsa-exclusiva-para-testes"
      DEBUG: "False"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Iniciar servidor Django
        run: |
          python src/manage.py migrate --noinput
          python src/manage.py runserver 0.0.0.0:8000 > /tmp/django.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/ > /dev/null; then
              echo "Servidor Django iniciado."
              break
            fi
            sleep 1
          done
          curl --fail http://localhost:8000/ || (cat /tmp/django.log && exit 1)

      - name: Executar testes
        run: pytest
